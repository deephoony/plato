# @package _global_
# Per-env PLATO hyperparameters for cheetah-vel.
# Loaded automatically when running `algo=plato env=cheetah-vel`.
algo_params:
  allow_backward_z: false
  use_FOCAL_cl: true
  use_club: true
  use_prediction: false
  use_decoder: true
  use_simulate: true
  use_lore: true
  use_adaptive_alpha: false
  alpha_lr: 0.3
  target_divergence: 0.1
  recon_loss_weight: 1.0
  reward_recon_scale: 1.0
  recon_detach_z: true
  num_ensemble: 10
  use_bootstrap: true
  bootstrap_ratio: 0.8
  decoder_lr: 0.0003
  rollout_horizon: 3
  rollout_weight: 0.3
  lambda_pess: 2.5
  simulate_warmup_steps: 10000
  rollout_state_clip_K: 10.0
  alpha_init: 20.0
  alpha_max:  1000.0
  lore_alpha:      1.0
  lore_p_exponent: 2.0

